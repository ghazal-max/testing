<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Login Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-container {
      width: 100%;
      max-width: 340px;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 400;
      color: #f0f6fc;
      margin-top: 16px;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #f0f6fc;
    }

    .form-group input {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      outline: none;
    }

    .form-group input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      background-color: #238636;
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: #2ea043;
    }

    .message {
      margin-top: 16px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .message.success {
      display: block;
      background-color: rgba(46, 160, 67, 0.15);
      border: 1px solid #2ea043;
      color: #3fb950;
    }

    .message.error {
      display: block;
      background-color: rgba(248, 81, 73, 0.15);
      border: 1px solid #f85149;
      color: #f85149;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="header">
      <h1>Sign in for Testing</h1>
    </div>

    <div class="card">
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username or email address</label>
          <input type="text" id="username" required autocomplete="off" placeholder="admin">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="password123">
        </div>

        <button type="submit" class="btn-submit">Sign in</button>
      </form>

      <div id="statusMessage" class="message"></div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('statusMessage');

      // Simple frontend check for testing
      if (username === 'admin' && password === 'password123') {
        messageDiv.className = 'message success';
        messageDiv.textContent = 'Login successful! Test passed.';
      } else {
        messageDiv.className = 'message error';
        messageDiv.textContent = 'Incorrect username or password.';
      }
    });
  </script>

</body>
</html>
